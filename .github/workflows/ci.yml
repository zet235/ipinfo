name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # The parsers and the subprocess runner are exercised against macOS binaries.
    runs-on: macos-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: extensions/ipinfo
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: extensions/ipinfo/package-lock.json

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run lint
      - run: npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: ipinfo-build
          path: extensions/ipinfo/build/
          if-no-files-found: error
          retention-days: 14
